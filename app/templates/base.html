<!DOCTYPE html>
<html lang="cs" {% if current_user.is_authenticated and current_user.dark_mode %}data-bs-theme="dark"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  {% set _csp_nonce = g.get('csp_nonce', '') %}
  {# Consumed by FullCalendar (and any third-party lib that reads it) to nonce runtime-injected <style> tags. #}
  <meta name="csp-nonce" content="{{ _csp_nonce }}">
  {# Nonce-propagation shim: some third-party libraries (e.g. Flatpickr) create
     <style> elements at runtime without consulting the csp-nonce meta tag.
     Under a nonce-only style-src those inserts are blocked silently. This
     shim wraps document.createElement so every <style> element automatically
     carries the current request's nonce. Loaded before any third-party JS. #}
  <script nonce="{{ _csp_nonce }}">
    (function () {
      var nonce = {{ _csp_nonce | tojson }};
      var origCreate = document.createElement.bind(document);
      document.createElement = function (tag) {
        var el = origCreate.apply(document, arguments);
        if (typeof tag === "string" && tag.toLowerCase() === "style") {
          el.setAttribute("nonce", nonce);
          try { el.nonce = nonce; } catch (e) { /* IDL setter may be readonly on very old engines */ }
        }
        return el;
      };
    })();
  </script>
  <title>{% block title %}MedCover{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="16x16 32x32 48x48" type="image/x-icon">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

  <!-- Custom styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ static_ver }}">

  <!-- Flatpickr (24h datetime picker) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  {% block extra_head %}{% endblock %}
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="{{ url_for('static', filename='img/logo_nav.webp') }}"
             alt="MedCover logo" height="36" width="40">
        <span class="d-none d-sm-inline">MedCover</span>
      </a>

      {# ── Mobile-only quick links (outside collapse, always visible) ── #}
      {% if current_user.is_authenticated %}
      <div class="d-flex d-lg-none ms-auto me-2 gap-1 align-items-center">
        <a class="btn btn-outline-light btn-sm py-0 px-2"
           href="{{ url_for('events.index') }}">Akce</a>
        {% if current_user.has_permission('equipment.view') %}
        <a class="btn btn-outline-light btn-sm py-0 px-2"
           href="{{ url_for('equipment.items') }}">Vybavení</a>
        {% endif %}
        {% if feedback_enabled %}
        <a class="btn btn-outline-light btn-sm py-0 px-2"
           href="{{ url_for('feedback.feedback_form', **{'from': request.full_path.rstrip('?')}) }}">💬</a>
        {% endif %}
      </div>
      {% endif %}

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto">
          {% if current_user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('events.index') }}">Akce</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('master_events.index') }}">Nadřazené akce</a></li>
          {% if current_user.has_permission('event_template.view') %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('templates.index') }}">Šablony akcí</a></li>
          {% endif %}
          {% if current_user.has_permission('equipment.view') %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('equipment.items') }}">Vybavení</a></li>
          {% endif %}
          {% if current_user.has_permission('qualification.view') %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('qualifications.index') }}">Kvalifikace</a></li>
          {% endif %}
          {% if current_user.has_permission('report.view') %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('reports.index') }}">Přehledy</a></li>
          {% endif %}
          {% if current_user.has_permission('debriefing.manage') %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('debriefing.manage') }}">Debriefing</a></li>
          {% endif %}
          {% if current_user.has_permission('user.view') %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('users.index') }}">Uživatelé</a></li>
          {% endif %}
          {% if current_user.has_permission('admin.view') %}
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Administrace</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="{{ url_for('admin.index') }}">Dashboard</a></li>
              <li><a class="dropdown-item" href="{{ url_for('users.invites') }}">Pozvánky</a></li>
              <li><a class="dropdown-item" href="{{ url_for('admin.audit_log_list') }}">Audit log</a></li>
              {% if current_user.has_permission('admin.manage_settings') %}
              <li><a class="dropdown-item" href="{{ url_for('import_events.events_paste') }}">Import</a></li>
              {% endif %}
              <li><a class="dropdown-item" href="{{ url_for('admin.permissions') }}">Přehled oprávnění</a></li>
              {% if current_user.has_permission('admin.manage_digest') %}
              <li><a class="dropdown-item" href="{{ url_for('admin_digest.index') }}">Přehledový e-mail</a></li>
              {% endif %}
              <li><a class="dropdown-item" href="{{ url_for('backup.index') }}">Zálohy</a></li>
              {% if current_user.has_permission('admin.manage_settings') %}
              <li><a class="dropdown-item" href="{{ url_for('notifications.index') }}">Oznámení</a></li>
              <li><a class="dropdown-item" href="{{ url_for('app_settings.index') }}">Nastavení</a></li>
              {% endif %}
            </ul>
          </li>
          {% endif %}
          {% endif %}
        </ul>
        <ul class="navbar-nav">
          {% if current_user.is_authenticated %}
            {% if feedback_enabled %}
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('feedback.feedback_form', **{'from': request.full_path.rstrip('?')}) }}"
                 title="Zpětná vazba">
                💬 Zpětná vazba
              </a>
            </li>
            {% endif %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('main.changelog') }}">Změny ve verzích</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('users.profile') }}">{{ current_user.name }}</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.logout') }}">Odhlásit</a></li>
          {% elif request.endpoint != 'auth.login' %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.login') }}">Přihlásit</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap 5.3.8 JS bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <!-- Flatpickr JS + global init for all .flatpickr-dt inputs -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/cs.js"></script>
  <script src="{{ url_for('static', filename='js/app-init.js') }}?v={{ static_ver }}"></script>

  <!-- Client-side validation -->
  <script src="{{ url_for('static', filename='js/validate.js') }}?v={{ static_ver }}"></script>

  <!-- Centralized CSRF fetch wrapper -->
  <script src="{{ url_for('static', filename='js/csrf-fetch.js') }}?v={{ static_ver }}"></script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>

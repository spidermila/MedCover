name: Build & Deploy to Azure Container Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Azure after build?'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/spidermila/medcover
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            # Manual run: use sanitised branch name
            BRANCH="${{ github.ref_name }}"
            TAG="${BRANCH//\//-}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          if [[ "${{ steps.meta.outputs.push_latest }}" == "true" ]]; then
            docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} ${{ env.IMAGE_NAME }}:latest
            docker push ${{ env.IMAGE_NAME }}:latest
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy web container
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: medcover-web
          resourceGroup: rg-oscckfm
          imageToDeploy: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy scheduler container
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: medcover-scheduler
          resourceGroup: rg-oscckfm
          imageToDeploy: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

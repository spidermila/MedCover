[tox]
envlist = py314
skipsdist = true

[testenv]
deps = -r requirements-dev.txt
passenv = TEST_DATABASE_URL
commands = pytest tests/ {posargs}

[testenv:e2e]
skip_install = true
allowlist_externals = docker, podman
commands =
    {env:CONTAINER_ENGINE:podman} compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
    {env:CONTAINER_ENGINE:podman} compose -f docker-compose.e2e.yml down -v

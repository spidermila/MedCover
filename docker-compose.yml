services:
  web:
    platform: linux/amd64
    image: localhost/medcover_web:latest
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    command: flask run --host=0.0.0.0 --debug
    restart: unless-stopped
    volumes:
      - .:/app:z
    env_file: .env
    environment:
      # Azurite's public development key — not a secret.
      BACKUP_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      azurite:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    platform: linux/amd64
    image: localhost/medcover_scheduler:latest
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    entrypoint: ["/docker-entrypoint-scheduler.sh"]
    command: python scheduler/main.py
    restart: unless-stopped
    volumes:
      - .:/app:z
    env_file: .env
    environment:
      # Azurite's public development key — not a secret.
      BACKUP_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      web:
        condition: service_healthy
      azurite:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "7"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os, time; f='/tmp/scheduler_heartbeat'; assert os.path.exists(f) and time.time()-os.path.getmtime(f)<30"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Azure Blob Storage emulator holding the DB backup archives, so web and
  # scheduler see the same backups (Azure prod uses a real storage account).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data:z

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "DevPassword123!"
      MSSQL_COLLATION: "Czech_100_CI_AS_SC_UTF8"
      MSSQL_MEMORY_LIMIT_MB: "512"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql:z
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "DevPassword123!", "-C", "-Q", "SELECT 1", "-b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot initializer: the MSSQL image has no auto-init directory, so this
  # creates the medcover_dev database (Czech collation + RCSI) and the app
  # login/user once the db container is healthy, then exits. Runs automatically
  # on `docker compose up`; idempotent, so re-runs are safe.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_HOST: db
      MSSQL_SA_PASSWORD: "DevPassword123!"
    volumes:
      - ./mssql-init:/mssql-init:ro
    entrypoint: ["/bin/bash", "/mssql-init/setup.sh"]
    restart: "no"

volumes:
  mssql_data:
  # Azurite blob data (DB backups). Survives `compose down`; wiped only by
  # `compose down -v`.
  azurite_data:

services:
  db-e2e:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    tmpfs:
      - /var/opt/mssql/data
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "E2e_Password1!"
      MSSQL_COLLATION: "Czech_100_CI_AS_SC_UTF8"
      MSSQL_MEMORY_LIMIT_MB: "512"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "E2e_Password1!", "-C", "-Q", "SELECT 1", "-b"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web-e2e:
    build:
      context: .
      args:
        GIT_COMMIT: e2e
    entrypoint: ["/e2e-entrypoint.sh"]
    command: ["flask", "run", "--debug", "--host=0.0.0.0"]
    volumes:
      - ./scripts/e2e-entrypoint.sh:/e2e-entrypoint.sh:ro
      - ./scripts:/app/scripts:ro
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      SECRET_KEY: e2e-test-secret-key
      DATABASE_URL: "mssql+pyodbc://medcover:E2e_Password1!@db-e2e:1433/medcover_e2e?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes"
      MSSQL_SA_PASSWORD: "E2e_Password1!"
      DEV_LOGIN_ENABLED: "true"
      INSTANCE_ID: e2e
    depends_on:
      db-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /e2e
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./e2e_tests:/e2e
      - ./e2e-report:/e2e-report
    environment:
      BASE_URL: http://web-e2e:5000
      E2E_BROWSERS: ${E2E_BROWSERS:---browser chromium --browser firefox --browser webkit}
    entrypoint:
      - "sh"
      - "-c"
      - |
        echo 'Waiting for web-e2e...'
        retries=60
        until curl -sf http://web-e2e:5000/health >/dev/null 2>&1; do
          retries=$$((retries-1))
          [ "$$retries" -le 0 ] && echo 'web-e2e did not become ready in time' && exit 1
          sleep 2
        done
        echo 'web-e2e ready'
        pytest /e2e $E2E_BROWSERS -v --screenshot on --output /e2e-report/traces --html=/e2e-report/report.html --self-contained-html -o 'addopts='
    depends_on:
      web-e2e:
        condition: service_healthy
